global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: 'movapp-monitor'

scrape_configs:
  - job_name: 'movapp'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['movapp:8080']
        labels:
          application: 'movapp'
          env: 'dev'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
