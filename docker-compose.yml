services:
  postgres:
    image: postgres:16-alpine
    container_name: movapp-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - movapp-net

  movapp:
    build: .
    image: movapp
    container_name: movapp
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movapp-net

  frontend:
    build:
      context: ./movapp-front
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    image: movapp-front
    container_name: movapp-front
    ports:
      - "3000:80"
    depends_on:
      - movapp
    networks:
      - movapp-net

  prometheus:
    image: prom/prometheus:latest
    container_name: movapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - movapp
    networks:
      - movapp-net

  grafana:
    image: grafana/grafana:latest
    container_name: movapp-grafana
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - movapp-net

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  movapp-net:
    driver: bridge
