spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# configuracao do HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MovAppPool

# config cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# Logging
# Nível por logger (padrões e MDC vêm de logback-spring.xml, conforme o perfil).
logging.level.com.loja.movapp=INFO
logging.level.root=WARN

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Credenciais dos usuários — obrigatoriamente via variável de ambiente em produção
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.user.username=${USER_USERNAME:usuario}
app.user.password=${USER_PASSWORD}

# Perfil ativo: usa 'dev' localmente se SPRING_PROFILES_ACTIVE não estiver definido
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Identificação da aplicação (vira tag em todas as métricas)
spring.application.name=movapp

# Actuator / Observabilidade
# Endpoints públicos: health (orchestrators) + info + prometheus (scrape).
# Em produção, prometheus deveria ficar atrás de management.server.port + firewall.
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,flyway,env
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.git.mode=full
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}


